{% extends "financas/base.html" %}
{% block titulo %}Entrar – Gestão Financeira{% endblock %}
{% block conteudo %}
<div class="login cartao">
  <h1>Gestão Financeira</h1>
  {% if form.errors %}<p class="erros">Usuário ou senha incorretos.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Usuário" autofocus autocomplete="username" required>
    <input type="password" name="password" placeholder="Senha" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn prim" style="justify-content:center">Entrar</button>
  </form>
</div>
{% endblock %}
